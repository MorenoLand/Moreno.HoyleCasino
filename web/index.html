<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="hoylecasino.ico">
<title>Hoyle Casino</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; background: #000; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" width="640" height="480" tabindex="0"></canvas>

<script>
  window.addEventListener('error', function (e) { console.log('[error] ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) { console.log('[reject] ' + e.reason); });
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.log(text); },
    onAbort: function (what) { console.log('[abort] ' + what); },
    onRuntimeInitialized: function () {
      window.__hoyleReady = true;
      Module.__pkg = null;
      Module.canvas.focus();
      if (Module._wasm_start) Module._wasm_start();
      Module.canvas.addEventListener('pointerdown', function () {
        if (Module._wasm_start) Module._wasm_start();
      }, { once: true });
    }
  };
  (function () {
    var parts = [0, 1, 2, 3].map(function (i) { return 'hoyle.data.part' + i; });
    Promise.all(parts.map(function (p) {
      return fetch(p).then(function (r) {
        if (!r.ok) throw new Error(p + ' ' + r.status);
        return r.arrayBuffer();
      });
    })).then(function (bufs) {
      var size = 0;
      for (var i = 0; i < bufs.length; ++i) size += bufs[i].byteLength;
      var all = new Uint8Array(size), off = 0;
      for (var j = 0; j < bufs.length; ++j) { all.set(new Uint8Array(bufs[j]), off); off += bufs[j].byteLength; }
      Module.__pkg = all.buffer;
      Module.getPreloadedPackage = function () { return Module.__pkg; };
      return load('web.js?v=8').then(function () { return load('hoyle.js?v=8'); });
    }).catch(function (e) { console.log('[load] ' + e); });
    function load(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error(src)); };
        document.body.appendChild(s);
      });
    }
  })();
</script>
</body>
</html>
